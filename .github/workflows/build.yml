name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking dependency security updates
        if: github.event_name != 'pull_request'
        run: |
          npm audit fix --package-lock-only
          npm ci
      - name: Report remaining dependency vulnerabilities
        run: npm audit --json > npm-audit-report.json || true
      - name: Build production bundle
        run: npm run build
      - name: Commit updated lockfile
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Apply non-breaking dependency security updates"
            git push
          fi
