name: Backup source to Cloudflare R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stationery-dot-com-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create and upload versioned source backup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: 5048da0aa184b4fbb033f13a83d1cac6
          R2_BUCKET: stationery-dot-com-backups
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 credentials are not configured. Add repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi

          python -m pip install --disable-pip-version-check boto3

          python <<'PY'
          import os, io, zipfile, boto3
          from datetime import datetime, timezone
          from botocore.config import Config

          account = os.environ["R2_ACCOUNT_ID"]
          bucket = os.environ["R2_BUCKET"]
          sha = os.environ["GIT_SHA"]
          ref = os.environ["GIT_REF"]
          stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
          key = f"source/{stamp}-{sha[:12]}.zip"

          excluded_dirs = {
              ".git", "node_modules", "dist", "build", "coverage",
              ".wrangler", ".vercel", ".next", ".cache", "__pycache__"
          }
          excluded_names = {
              ".env", ".env.local", ".env.production", ".npmrc",
              "credentials.json", "service-account.json"
          }
          excluded_suffixes = (".pem", ".key", ".p12", ".pfx")

          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in excluded_dirs]
                  for filename in files:
                      path = os.path.join(root, filename)
                      normalized = path.replace("\\", "/").lstrip("./")
                      base = os.path.basename(filename)
                      if base in excluded_names or base.startswith(".env.") or base.startswith(".env"):
                          continue
                      if filename.lower().endswith(excluded_suffixes):
                          continue
                      if normalized.endswith((".log", ".sqlite", ".db")):
                          continue
                      archive.write(path, normalized)

          buffer.seek(0)
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{account}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4")
          )
          client.put_object(
              Bucket=bucket,
              Key=key,
              Body=buffer.getvalue(),
              ContentType="application/zip",
              Metadata={"commit": sha, "branch": ref}
          )
          print(f"Uploaded backup: {key}")

          objects = client.list_objects_v2(Bucket=bucket, Prefix="source/").get("Contents", [])
          objects.sort(key=lambda obj: obj["LastModified"], reverse=True)
          stale = objects[10:]
          if stale:
              client.delete_objects(
                  Bucket=bucket,
                  Delete={"Objects": [{"Key": obj["Key"]} for obj in stale], "Quiet": True}
              )
          print(f"Retention complete: kept {min(len(objects), 10)} versions; removed {len(stale)} old versions.")
          PY
