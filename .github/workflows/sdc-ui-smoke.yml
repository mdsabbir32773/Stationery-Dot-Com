name: SDC UI smoke test

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit to verify after deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sdc-ui-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install temporary browser test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Test live site UX, checkout and security workflows
        run: node scripts/sdc-ui-smoke.mjs
