name: SDC UI smoke test

on:
  workflow_run:
    workflows:
      - Build and deploy Stationery Dot Com to Cloudflare Workers
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: sdc-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployment completed successfully
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Deployment workflow concluded with ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install temporary browser test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Test live site UX, checkout and security workflows
        run: node scripts/sdc-ui-smoke.mjs
