name: One-time Meta webhook setup
on:
  workflow_run:
    workflows: ["Build and deploy Stationery Dot Com to Cloudflare Workers"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  setup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Invoke one-time setup endpoint
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 -X POST "https://stationerydotcom.stdc.workers.dev/_internal/meta-setup-once-7f3d9a6c2e814b05a9d4c7e1f6382b50"
