name: Build check
# Dependency security updates are applied and committed automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Upgrade React Router and apply dependency security updates
        if: github.event_name != 'pull_request'
        run: |
          npm install --save react-router-dom@^7.18.6
          npm audit fix --package-lock-only || true
          npm ci
      - name: Report remaining dependency vulnerabilities
        run: npm audit --json > npm-audit-report.json || true
      - name: Validate live smoke test script syntax
        run: npm run check:smoke-script
      - name: Build production bundle
        run: npm run build
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
      - name: Enforce production bundle budgets
        run: npm run check:bundle
      - name: Validate sitemap fallback
        run: npm run check:sitemap
      - name: Validate analytics integration
        run: npm run check:analytics
      - name: Commit updated lockfile
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Apply non-breaking dependency security updates"
            git push
          fi
