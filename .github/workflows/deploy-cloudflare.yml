name: Build and deploy Stationery Dot Com to Cloudflare Workers

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stationery-dot-com-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
      - name: Enforce production bundle budgets
        run: npm run check:bundle
      - name: Validate sitemap fallback
        run: npm run check:sitemap
      - name: Validate analytics integration
        run: npm run check:analytics
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5048da0aa184b4fbb033f13a83d1cac6
      - name: Trigger live UI smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sdc-ui-smoke.yml --ref main -f commit_sha=${GITHUB_SHA}
