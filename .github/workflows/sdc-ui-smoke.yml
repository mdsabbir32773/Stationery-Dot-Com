name: SDC UI smoke test

on:
  workflow_run:
    workflows:
      - Build and deploy Stationery Dot Com to Cloudflare Workers
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: sdc-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install temporary browser test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Test live SDC chat workflows
        run: node scripts/sdc-ui-smoke.mjs
